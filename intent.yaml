apiVersion: sourceplane.io/v1
kind: Intent

metadata:
  name: stratus
  description: .NET multi-tenant SaaS baseline on Azure Container Apps
  namespace: sourceplane

# No `execution.state` block yet: this repo is not bound to an Orun Cloud
# workspace, and declaring one with an empty id plus requireOrg would fail fast
# on every non-interactive run. State stays local until the workspace exists,
# at which point this block and CI's --remote-state flag land together.

compositions:
  sources:
    # The .NET/Azure composition stack, consumed as a published OCI artifact.
    # Pin an explicit version: a bare repository reference resolves to :latest,
    # which would let a catalog release change this repo's execution contracts
    # without a commit here. Bumping the tag is the deliberate upgrade step.
    - name: stack-basalt
      kind: oci
      ref: oci://ghcr.io/sourceplane/stack-basalt:0.2.0
  resolution:
    precedence:
      - stack-basalt
    bindings:
      dotnet-service: stack-basalt
      dotnet-package: stack-basalt
      ef-migrate: stack-basalt
      terraform-azure: stack-basalt

discovery:
  roots:
    - src/
    - infra/
    - migrations/

automation:
  triggerBindings:
    github-pull-request:
      description: Pull request validation
      on:
        provider: github
        event: pull_request
        actions: [opened, synchronize, reopened, ready_for_review]
        baseBranches: [main]
      plan:
        scope: changed
        base: pull_request.base.sha
        head: pull_request.head.sha

    github-push-main:
      description: Stack convergence after merge
      on:
        provider: github
        event: push
        branches: [main]

    github-manual:
      description: Manual full-fleet convergence (workflow_dispatch)
      on:
        provider: github
        event: workflow_dispatch

    local-development:
      description: Local planning
      on:
        provider: local

environments:
  # One environment for the walking skeleton. prod is an additive block once
  # stage has proven every lane — the components are already
  # environment-parameterised, so it costs an intent edit, not a refactor.
  stage:
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
        - github-manual
        - local-development
    parameterDefaults:
      # Shared, OPTIONAL values only. A schema-required parameter is declared on
      # the component itself — environment defaults do not satisfy `required`,
      # which `orun plan` enforces even though `orun component` does not.
      #
      # An OPTIONAL parameter must still be given a value somewhere. A schema
      # `default:` is documentation, not a fallback: orun does not materialise
      # it, so an undeclared parameter renders as the literal string
      # "<no value>" in the step it is interpolated into. That is how
      # verify-structure failed — `test -f "<no value>"` exits 1 with no output,
      # which reads as a mystery. Everything below has a schema default and is
      # interpolated unguarded, so every one of them needs a value here; the CI
      # plan step now greps plan.json for "<no value>" so a new one cannot land
      # unnoticed.
      dotnet-package:
        packageOutput: artifacts/packages
      ef-migrate:
        connectionSecretRef: DATABASE_CONNECTION_STRING
      dotnet-service:
        dockerfile: Dockerfile
        healthPath: /health
        smokeRetries: "12"
        canaryWeight: "10"
        canarySoakSeconds: "60"
        # Coolify is the small baseline's target: one bearer token instead of
        # an Entra app registration plus a federated-identity trust, and real
        # Kafka/RabbitMQ/Postgres as first-class services beside it. The Azure
        # Container Apps path stays in the catalog for the sophisticated
        # baseline — it is a profile choice, not a fork of the repo.
        registry: ghcr.io/sourceplane
        coolifyUrl: ""
        acrName: ""
        resourceGroup: ""
        azureClientId: ""
        azureTenantId: ""
        azureSubscriptionId: ""
      terraform-azure:
        namespace: sourceplane
        namespacePrefix: stg-
        owner: sourceplane
        repo: stratus
        azureClientId: ""
        azureTenantId: ""
        azureSubscriptionId: ""
    policies:
      requireApproval: "false"
    env:
      ASPNETCORE_ENVIRONMENT: Staging
