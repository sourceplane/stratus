apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: platform
  description: Container Apps Environment bound to Log Analytics, with Dapr enabled for Workflow
spec:
  type: terraform-azure
  lifecycle: production
  owner: platform
  domain: stratus-infra
  path: infra/platform
  dependsOn:
    - component: foundation
    - component: data-plane
    - component: messaging-plane
  subscribe:
    environments:
      # `verify` is fmt-only and entirely offline. The plan/apply profiles need
      # an Azure credential, and this baseline deploys to Coolify — these roots
      # are the data plane for the SOPHISTICATED (Azure Container Apps)
      # baseline, kept valid and inert rather than deleted. The profileRules
      # that select plan/apply land with the Azure connection.
      - name: stage
        profile: verify
  parameters:
    terraformVersion: "1.9.8"
    stackName: platform
    terraformDir: terraform
    secretOutputs: "CONTAINER_APPS_ENVIRONMENT_ID=container_apps_environment_id"
  labels:
    team: platform
    layer: infra
