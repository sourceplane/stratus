apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: platform
  description: Container Apps Environment bound to Log Analytics, with Dapr enabled for Workflow
spec:
  type: terraform-azure
  lifecycle: production
  owner: platform
  domain: stratus-infra
  path: infra/platform
  dependsOn:
    - component: foundation
    - component: data-plane
    - component: messaging-plane
  subscribe:
    environments:
      - name: stage
        # `verify` is fmt-only and offline, so a PR from a fork still gets a
        # signal. plan/apply need the Azure connection and are selected by
        # trigger, which is why the default stays offline.
        profile: verify
        profileRules:
          - profile: plan
            when:
              triggerRef: github-pull-request
          - profile: apply
            when:
              triggerRef: github-push-main
  parameters:
    terraformVersion: "1.9.8"
    stackName: platform
    terraformDir: terraform
    secretOutputs: "CONTAINER_APPS_ENVIRONMENT_ID=container_apps_environment_id"
  labels:
    team: platform
    layer: infra
