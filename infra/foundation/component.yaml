apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: foundation
  description: Resource group, Log Analytics, App Insights, managed identities, federated credentials, ACR, Key Vault
spec:
  type: terraform-azure
  lifecycle: production
  owner: platform
  domain: stratus-infra
  path: infra/foundation

  subscribe:
    environments:
      # `verify` is fmt-only and entirely offline. The plan/apply profiles need
      # an Azure credential, and this baseline deploys to Coolify — these roots
      # are the data plane for the SOPHISTICATED (Azure Container Apps)
      # baseline, kept valid and inert rather than deleted. The profileRules
      # that select plan/apply land with the Azure connection.
      - name: stage
        profile: verify
  parameters:
    terraformVersion: "1.9.8"
    stackName: foundation
    terraformDir: terraform
    secretOutputs: "ACR_NAME=acr_name,RESOURCE_GROUP=resource_group,LOG_ANALYTICS_ID=log_analytics_workspace_id,MANAGED_IDENTITY_CLIENT_ID=managed_identity_client_id"
  labels:
    team: platform
    layer: infra
