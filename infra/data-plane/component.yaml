apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: data-plane
  description: Postgres Flexible Server with Entra auth and PgBouncer, plus Azure Cache for Redis
spec:
  type: terraform-azure
  lifecycle: production
  owner: platform
  domain: stratus-infra
  path: infra/data-plane
  dependsOn:
    - component: foundation
  subscribe:
    environments:
      - name: stage
        # `verify` is fmt-only and offline, so a PR from a fork still gets a
        # signal. plan/apply need the Azure connection and are selected by
        # trigger, which is why the default stays offline.
        profile: verify
        profileRules:
          - profile: plan
            when:
              triggerRef: github-pull-request
          - profile: apply
            when:
              triggerRef: github-push-main
  parameters:
    terraformVersion: "1.9.8"
    stackName: data-plane
    terraformDir: terraform
    secretOutputs: "POSTGRES_FQDN=postgres_fqdn,POSTGRES_DATABASE=postgres_database,REDIS_HOST=redis_host"
  labels:
    team: platform
    layer: infra
