apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: data-plane
  description: Postgres Flexible Server with Entra auth and PgBouncer, plus Azure Cache for Redis
spec:
  type: terraform-azure
  lifecycle: production
  owner: platform
  domain: stratus-infra
  path: infra/data-plane
  dependsOn:
    - component: foundation
  subscribe:
    environments:
      # `verify` is fmt-only and entirely offline. The plan/apply profiles need
      # an Azure credential, and this baseline deploys to Coolify — these roots
      # are the data plane for the SOPHISTICATED (Azure Container Apps)
      # baseline, kept valid and inert rather than deleted. The profileRules
      # that select plan/apply land with the Azure connection.
      - name: stage
        profile: verify
  parameters:
    terraformVersion: "1.9.8"
    stackName: data-plane
    terraformDir: terraform
    secretOutputs: "POSTGRES_FQDN=postgres_fqdn,POSTGRES_DATABASE=postgres_database,REDIS_HOST=redis_host"
  labels:
    team: platform
    layer: infra
