apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: messaging-plane
  description: Event Hubs namespace (Kafka endpoint) and Service Bus namespace (AMQP)
spec:
  type: terraform-azure
  lifecycle: production
  owner: platform
  domain: stratus-infra
  path: infra/messaging-plane
  dependsOn:
    - component: foundation
  subscribe:
    environments:
      # `verify` is fmt-only and entirely offline. The plan/apply profiles need
      # an Azure credential, and this baseline deploys to Coolify — these roots
      # are the data plane for the SOPHISTICATED (Azure Container Apps)
      # baseline, kept valid and inert rather than deleted. The profileRules
      # that select plan/apply land with the Azure connection.
      - name: stage
        profile: verify
  parameters:
    terraformVersion: "1.9.8"
    stackName: messaging-plane
    terraformDir: terraform
    secretOutputs: "EVENTHUBS_NAMESPACE=eventhubs_namespace,SERVICEBUS_NAMESPACE=servicebus_namespace"
  labels:
    team: platform
    layer: infra
