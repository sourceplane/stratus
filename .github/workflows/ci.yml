name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Plan EVERY component, not just the changed ones. `--changed` is right for
  # ordinary commits, but it means a commit touching only CI or intent produces
  # an empty matrix and a green check that verified nothing. This is the way to
  # force a full convergence — and the way to prove the fleet still builds.
  workflow_dispatch:
    inputs:
      full:
        description: Plan every component (ignore --changed)
        type: boolean
        default: true

# PR runs share a group per ref and superseded runs are cancelled (each push
# re-plans anyway). Main pushes get a unique group: convergence plans --changed
# per commit, and GitHub replaces *pending* runs in a shared group even with
# cancel-in-progress false, which would leave a superseded commit's components
# silently unconverged.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write

# One workflow, and it only calls orun. Build tooling lives in the composition
# stack — a raw `dotnet build` step here is how CI and the deploy lane start to
# disagree about what "built" means.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      job-count: ${{ steps.matrix.outputs.job-count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.53.2
      - run: |
          set -euo pipefail
          plan_args=(
            --from-ci github
            --event-file "$GITHUB_EVENT_PATH"
            --intent intent.yaml
            --output plan.json
          )
          if [ "${{ inputs.full }}" != "true" ]; then
            plan_args+=(--changed)
          fi
          orun plan "${plan_args[@]}"
      - id: matrix
        run: |
          # `echo "x=$(jq ...)"` returns ECHO's exit code, so a failed jq — or a
          # plan.json that was never written — reported success and produced an
          # empty matrix. Assert the file exists and let jq's failure be the
          # step's failure.
          set -euo pipefail
          test -f plan.json || {
            echo "plan wrote no plan.json — did any trigger binding match this event?" >&2
            exit 1
          }
          count="$(jq '.jobs | length' plan.json)"
          echo "planned ${count} job(s)"
          echo "job-count=${count}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: orun-plan
          path: plan.json

  run:
    needs: plan
    runs-on: ubuntu-latest
    if: needs.plan.outputs.job-count != '0'
    name: converge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: orun-plan
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.53.2

      # ONE job runs the WHOLE plan, in dependency order.
      #
      # This was a matrix fanning out one GitHub job per component, and it was
      # silently useless: each runner has its own LOCAL orun state, so a job
      # could never observe that its dependency had completed on a different
      # runner. Every component with a dependsOn edge reported "waiting",
      # executed zero steps, and exited 0 — a fully green run in which only the
      # six dependency-free components actually built.
      #
      # Cross-runner coordination is exactly what --remote-state provides, and
      # this repo has no workspace binding yet. Until it does, converging the
      # plan in a single runner is the honest option: slower, correct, and
      # incapable of reporting success for work it did not do.
      - name: converge
        run: |
          set -euo pipefail
          orun run \
            --plan plan.json \
            --runner github-actions \
            --exec-id "${EXEC_ID}"
        env:
          EXEC_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `orun run` exits 0 when jobs finish WAITING, so its exit code alone
      # cannot answer "did the fleet build". This reads the sealed execution
      # state and asserts every planned job reached `completed`. It runs even
      # when converge failed, so a partial run reports what did not execute
      # rather than only what broke. The script is negative-tested — see its
      # header for why the first version of this gate could never have fired.
      - name: assert every planned job ran
        if: always()
        run: |
          set -euo pipefail
          orun status --exec-id "${EXEC_ID}" --json > state.json
          ./scripts/assert-converged.sh plan.json state.json
        env:
          EXEC_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
