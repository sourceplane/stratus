apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: buildingblocks
  description: Shared abstractions — Entity, Result, repository and unit-of-work ports
spec:
  type: dotnet-package
  lifecycle: production
  owner: platform
  domain: stratus-shared
  path: src/BuildingBlocks/Stratus.BuildingBlocks
  subscribe:
    environments:
      - name: stage
        profile: quick-check
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    projectPath: src/BuildingBlocks/Stratus.BuildingBlocks/Stratus.BuildingBlocks.csproj
    testFilter: "FullyQualifiedName~Stratus.Architecture.Tests"
  labels:
    team: platform
    layer: shared
