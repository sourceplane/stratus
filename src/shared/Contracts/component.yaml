apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: contracts
  description: Shared library — Stratus.Contracts
spec:
  type: dotnet-package
  lifecycle: production
  owner: platform
  domain: stratus-shared
  path: src/shared/Contracts
  subscribe:
    environments:
      - name: stage
        profile: quick-check
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    projectPath: src/shared/Contracts/Stratus.Contracts.csproj
    testFilter: "FullyQualifiedName~Stratus.Contracts.Tests"
  labels:
    team: platform
    layer: shared
