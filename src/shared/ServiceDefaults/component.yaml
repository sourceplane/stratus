apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: servicedefaults
  description: Shared library — Stratus.ServiceDefaults
spec:
  type: dotnet-package
  lifecycle: production
  owner: platform
  domain: stratus-shared
  path: src/shared/ServiceDefaults
  subscribe:
    environments:
      - name: stage
        profile: quick-check
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    projectPath: src/shared/ServiceDefaults/Stratus.ServiceDefaults.csproj
    testFilter: "FullyQualifiedName~Stratus.ServiceDefaults.Tests"
  labels:
    team: platform
    layer: shared
