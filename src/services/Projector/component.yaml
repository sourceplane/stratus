apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: projector
  description: Event Hubs consumer — read-model projections (Kafka protocol)
spec:
  type: dotnet-service
  lifecycle: production
  owner: platform
  domain: stratus-runtime
  path: src/services/Projector
  dependsOn:
    # Shared libraries this service BUNDLES. Declared so a change to one marks
    # this service changed and redeploys it — without the edge, a plan keyed on
    # `path:` alone lets a service run a months-old copy of a package that has
    # since changed underneath it.
    - component: contracts
    - component: servicedefaults
    - component: messaging

  subscribe:
    environments:
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    projectPath: src/services/Projector/Stratus.Projector.csproj
    testFilter: "FullyQualifiedName~Stratus.Projector.Tests"
    imageName: stratus/projector
    containerAppName: stratus-projector-stage
    appConfigTemplate: src/services/Projector/appsettings.template.json
    appConfig: src/services/Projector/appsettings.Generated.json
    wiringComponents: "data-plane,messaging-plane"
    wiringEnvs: stage
    wiringFixture: src/services/Projector/wiring.fixture.json
  labels:
    team: platform
    layer: runtime
    surface: projector
