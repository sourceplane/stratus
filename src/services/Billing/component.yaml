apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: billing
  description: Plans, entitlements, usage counters
spec:
  type: dotnet-service
  lifecycle: production
  owner: platform
  domain: stratus-runtime
  path: src/services/Billing
  dependsOn:
    # Shared libraries this service BUNDLES. Declared so a change to one marks
    # this service changed and redeploys it — without the edge, a plan keyed on
    # `path:` alone lets a service run a months-old copy of a package that has
    # since changed underneath it.
    - component: contracts
    - component: servicedefaults
    - component: messaging
    - component: tenancy
  subscribe:
    environments:
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    projectPath: src/services/Billing/Stratus.Billing.csproj
    testFilter: "FullyQualifiedName~Stratus.Billing.Tests"
    imageName: stratus/billing
    containerAppName: stratus-billing-stage
    appConfigTemplate: src/services/Billing/appsettings.template.json
    appConfig: src/services/Billing/appsettings.Generated.json
    wiringComponents: "data-plane"
    wiringEnvs: stage
    wiringFixture: src/services/Billing/wiring.fixture.json
  labels:
    team: platform
    layer: runtime
    surface: billing
