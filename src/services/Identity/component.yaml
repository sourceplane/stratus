apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: identity
  description: Users, sessions, API keys
spec:
  type: dotnet-service
  lifecycle: production
  owner: platform
  domain: stratus-runtime
  path: src/services/Identity
  dependsOn:
    # Shared libraries this service BUNDLES. Declared so a change to one marks
    # this service changed and redeploys it — without the edge, a plan keyed on
    # `path:` alone lets a service run a months-old copy of a package that has
    # since changed underneath it.
    - component: contracts
    - component: servicedefaults
    - component: messaging

  # The Coolify API token, wire-now-seed-later: an unseeded key is skipped at
  # resolve, so this block is inert until the value exists in orun secrets.
  secretEnv:
    COOLIFY_TOKEN: "secret://stratus/stratus/{{ .environment }}/COOLIFY_TOKEN"
  optionalSecretEnv:
    GHCR_TOKEN: "secret://stratus/stratus/{{ .environment }}/GHCR_TOKEN"

  subscribe:
    environments:
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy-coolify
            when:
              triggerRef: github-push-main
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    projectPath: src/services/Identity/Stratus.Identity.csproj
    testFilter: "FullyQualifiedName~Stratus.Identity.Tests"
    coolifyAppUuid: ""
    serviceUrl: ""
    imageName: stratus/identity
    containerAppName: stratus-identity-stage
    appConfigTemplate: src/services/Identity/appsettings.template.json
    appConfig: src/services/Identity/appsettings.Generated.json
    wiringComponents: "data-plane,messaging-plane"
    wiringEnvs: stage
    wiringFixture: src/services/Identity/wiring.fixture.json
  labels:
    team: platform
    layer: runtime
    surface: identity
