apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: messaging
  description: Event Hubs and Service Bus adapters, the transactional outbox, idempotency
spec:
  type: dotnet-package
  lifecycle: production
  owner: platform
  domain: stratus-shared
  path: src/Shared/Stratus.Messaging
  subscribe:
    environments:
      - name: stage
        profile: quick-check
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    projectPath: src/Shared/Stratus.Messaging/Stratus.Messaging.csproj
    testFilter: ""
  labels:
    team: platform
    layer: shared
