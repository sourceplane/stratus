apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: identity
  description: Users and sign-in — five-layer clean architecture
spec:
  type: dotnet-service
  lifecycle: production
  owner: platform
  domain: stratus-runtime
  # One component per SERVICE, not per project. A component is a deploy unit;
  # the five layers inside build together and ship as one container.
  path: src/Services/Identity
  dependsOn:
    - component: buildingblocks
    - component: servicedefaults
    - component: contracts
    - component: messaging
    - component: buildingblocks-web
  # Best-effort, NOT secretEnv. A component's secretEnv is profile-blind: it is
  # resolved for every job the component plans, so declaring a deploy credential
  # there makes the verify lane — which never deploys — fail closed on a secret
  # it has no use for. That is what broke the fleet build. The profile-scoped
  # mechanism is the composition's per-profile secretBindings, but a required
  # binding must be mappable to a workspace/project scope at plan time and this
  # repo has no workspace binding yet; it lands with execution.state.
  #
  # Nothing is weakened by the move: the deploy-coolify step asserts the token
  # is non-empty before it calls Coolify, so the deploy lane still fails loudly,
  # at the step that actually needs it.
  optionalSecretEnv:
    COOLIFY_TOKEN: "secret://stratus/stratus/{{ .environment }}/COOLIFY_TOKEN"
    GHCR_TOKEN: "secret://stratus/stratus/{{ .environment }}/GHCR_TOKEN"
  subscribe:
    environments:
      - name: stage
        profile: verify
        profileRules:
          # Azure Container Apps. The catalog still carries deploy-coolify as a
          # sibling profile of the same job template — switching target is a
          # profile choice, not a fork — but this baseline is the Azure one, and
          # its registry entry declares requiredIntegrations ["azure"].
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    # This service's OWN tests, named as a project rather than selected
    # with --filter over the solution. A filter that matches nothing still
    # exits 0, so a typo would produce a green run that tested nothing; a
    # wrong project path fails with MSB1009, and TreatNoTestsAsError turns
    # an empty project into a failure too. Before this, the three services
    # with no filter each ran the entire solution suite.
    testCommand: "dotnet test tests/Stratus.Identity.Tests/Stratus.Identity.Tests.csproj --configuration Release --no-restore -- RunConfiguration.TreatNoTestsAsError=true"
    projectPath: src/Services/Identity/Stratus.Identity.Host/Stratus.Identity.Host.csproj
    imageName: stratus/identity
    containerAppName: stratus-identity-stage
    coolifyAppUuid: ""
    serviceUrl: ""
    appConfigTemplate: src/Services/Identity/appsettings.template.json
    appConfig: src/Services/Identity/Stratus.Identity.Host/appsettings.Generated.json
    wiringComponents: "data-plane,messaging-plane"
    wiringEnvs: stage
    wiringFixture: src/Services/Identity/wiring.fixture.json
  labels:
    team: platform
    layer: runtime
    surface: identity
