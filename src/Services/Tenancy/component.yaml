apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: tenancy
  description: Tenants, memberships and roles
spec:
  type: dotnet-service
  lifecycle: production
  owner: platform
  domain: stratus-runtime
  # One component per SERVICE, not per project. A component is a deploy unit;
  # the five layers inside build together and ship as one container.
  path: src/Services/Tenancy
  dependsOn:
    - component: buildingblocks
    - component: servicedefaults
    - component: contracts
    - component: messaging
    - component: buildingblocks-web
    - component: identity
  secretEnv:
    COOLIFY_TOKEN: "secret://stratus/stratus/{{ .environment }}/COOLIFY_TOKEN"
  optionalSecretEnv:
    GHCR_TOKEN: "secret://stratus/stratus/{{ .environment }}/GHCR_TOKEN"
  subscribe:
    environments:
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy-coolify
            when:
              triggerRef: github-push-main
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../../..
    projectPath: src/Services/Tenancy/Stratus.Tenancy.Host/Stratus.Tenancy.Host.csproj
    testFilter: "FullyQualifiedName~Stratus.Tenancy.Tests"
    imageName: stratus/tenancy
    containerAppName: stratus-tenancy-stage
    coolifyAppUuid: ""
    serviceUrl: ""
    appConfigTemplate: src/Services/Tenancy/appsettings.template.json
    appConfig: src/Services/Tenancy/Stratus.Tenancy.Host/appsettings.Generated.json
    wiringComponents: "data-plane,messaging-plane"
    wiringEnvs: stage
    wiringFixture: src/Services/Tenancy/wiring.fixture.json
  labels:
    team: platform
    layer: runtime
    surface: tenancy
