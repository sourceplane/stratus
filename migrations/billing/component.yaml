apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: migrations-billing
  description: EF Core migrations for the Billing bounded context
spec:
  type: ef-migrate
  lifecycle: production
  owner: platform
  domain: stratus-data
  path: migrations/billing
  dependsOn:
    - component: billing
  # Best-effort, NOT secretEnv — same reasoning as the services. The
  # plan-only profile builds the bundle, prints the SQL and rehearses it
  # against a throwaway Postgres; it never opens a connection to the
  # environment. A component-level secretEnv is profile-blind, so
  # declaring the connection there made the PR gate fail closed on a
  # credential only the apply lane uses. The apply step asserts the
  # variable is non-empty before running the bundle.
  optionalSecretEnv:
    DATABASE_CONNECTION_STRING: "secret://stratus/stratus/{{ .environment }}/BILLING_DATABASE_CONNECTION_STRING"
  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ../..
    projectPath: src/Services/Billing/Stratus.Billing.Infrastructure/Stratus.Billing.Infrastructure.csproj
    startupProject: src/Services/Billing/Stratus.Billing.Host/Stratus.Billing.Host.csproj
    bundleOutput: artifacts/migrate/billing
  labels:
    team: platform
    layer: data
