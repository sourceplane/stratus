apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: migrations
  description: EF Core migrations for the Stratus schema — planned on PR, applied on merge
spec:
  type: ef-migrate
  lifecycle: production
  owner: platform
  domain: stratus-data
  path: migrations
  dependsOn:
    - component: data-plane
  # The connection arrives as a secret reference, never a parameter — a
  # parameter would put the value in the plan. Wire-now-seed-later: an
  # unseeded key is skipped at resolve, so this is inert until the value
  # exists in orun secrets.
  secretEnv:
    DATABASE_CONNECTION_STRING: "secret://stratus/stratus/{{ .environment }}/DATABASE_CONNECTION_STRING"
  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
  parameters:
    dotnetVersion: "10.0.x"
    solutionDir: ..
    projectPath: ../src/shared/Contracts/Stratus.Contracts.csproj
    startupProject: ../src/services/Identity/Stratus.Identity.csproj
  labels:
    team: platform
    layer: data
